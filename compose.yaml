name: fantastix

services:
  web:
    image: "${NGINX_IMAGE:-nginx:1.28-alpine}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    environment:
      SERVER_ID: "${SERVER_ID:?Run ./scripts/configure-node.sh on this host first}"
      NGINX_ENVSUBST_FILTER: "^SERVER_ID$$"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
